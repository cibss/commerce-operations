name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

env:
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/commerce_operations_ci
  COMMERCE_API_ORIGIN: http://localhost:3003
  COMMERCE_PLATFORM_URL: http://localhost:3024

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commerce_operations_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d commerce_operations_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Verify runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate --workspace=@commerce/api

      - name: Seed test database
        run: npm run db:seed --workspace=@commerce/api

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  e2e:
    name: End-to-End
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commerce_operations_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d commerce_operations_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Verify runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate --workspace=@commerce/api

      - name: Seed test database
        run: npm run db:seed --workspace=@commerce/api

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
